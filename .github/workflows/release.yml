name: Release plugin ZIP

on:
  push:
    tags:
      - "popi-clanky-v*"
      - "popi-landing-v*"
      - "popi-events-v*"
      - "popishop-v*"
      - "popi-connector-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Select plugin from tag
        id: plugin
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == popi-clanky-* ]]; then
            echo "dir=popi-clanky-blog" >> "$GITHUB_OUTPUT"
            echo "name=popi-clanky-blog" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == popi-events-* ]]; then
            echo "dir=popi-events" >> "$GITHUB_OUTPUT"
            echo "name=popi-events" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == popishop-* ]]; then
            echo "dir=popishop-cart-handoff" >> "$GITHUB_OUTPUT"
            echo "name=popishop-cart-handoff" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == popi-connector-* ]]; then
            echo "dir=popi-connector" >> "$GITHUB_OUTPUT"
            echo "name=popi-connector" >> "$GITHUB_OUTPUT"
          else
            echo "dir=popi-landing-page" >> "$GITHUB_OUTPUT"
            echo "name=popi-landing-page" >> "$GITHUB_OUTPUT"
          fi

      - name: Test POPIshop plugin
        if: startsWith(github.ref_name, 'popishop-')
        run: php tests/php/cart-handoff-test.php

      - name: Test POPI Connector
        if: startsWith(github.ref_name, 'popi-connector-')
        run: php tests/php/connector-test.php

      - name: Create POPI Connector ZIP and checksum
        if: startsWith(github.ref_name, 'popi-connector-')
        run: |
          npm run package:connector
          cp dist/popi-connector.zip .
          cp dist/popi-connector.zip.sha256 .

      - name: Create ZIP and checksum
        if: ${{ !startsWith(github.ref_name, 'popi-connector-') }}
        shell: bash
        run: |
          cd "${{ steps.plugin.outputs.dir }}"
          zip -r "../${{ steps.plugin.outputs.name }}.zip" .
          cd ..
          sha256sum "${{ steps.plugin.outputs.name }}.zip" > "${{ steps.plugin.outputs.name }}.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.plugin.outputs.name }}.zip
            ${{ steps.plugin.outputs.name }}.zip.sha256
