name: Test plugins

on:
  pull_request:
  push:
    branches:
      - master
      - "staging/**"
      - "feature/**"

jobs:
  popishop-cart-handoff:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - run: php tests/php/cart-handoff-test.php
      - run: php tests/php/staging-guard-test.php
      - run: php tests/php/migration-recovery-guard-test.php
      - if: matrix.php-version == '8.3'
        run: npm run package:migration-toolkit
      - if: matrix.php-version == '8.3'
        run: unzip -t dist/popi-wordpress-migration-toolkit.zip
